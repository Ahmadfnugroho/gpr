name: Deploy Legacy VM

# Legacy VM deployment. Triggered manually only: the k3s rollout lives in
# deploy-prod.yml, and a push trigger here would deploy the same commit twice.
on:
  workflow_dispatch:

# Authenticate to the the server via ssh
# and run our deployment script
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: "cd /var/www/gpr && bash .scripts/deploy.sh"
