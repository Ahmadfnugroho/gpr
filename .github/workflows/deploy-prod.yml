name: Deploy Production

on:
  push:
    branches: [production]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # Docker requires a lowercase repository path; the GitHub owner is mixed-case.
  IMAGE: ghcr.io/ahmadfnugroho/gpr-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Roll out over SSH so the cluster API on 6443 stays closed to the
      # internet. kubectl runs on the node against the local k3s kubeconfig.
      - name: Roll out to gpr-prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            IMAGE=ghcr.io/ahmadfnugroho/gpr-backend
            TAG=sha-${{ github.sha }}
            kubectl -n gpr-prod set image deployment/gpr-backend web="$IMAGE:$TAG"
            kubectl -n gpr-prod set image deployment/gpr-worker worker="$IMAGE:$TAG"
            kubectl -n gpr-prod rollout status deployment/gpr-backend --timeout=180s
            kubectl -n gpr-prod rollout status deployment/gpr-worker --timeout=180s
