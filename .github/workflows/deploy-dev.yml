name: Deploy Dev

on:
  push:
    branches: [development]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gpr-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out to gpr-dev
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl -n gpr-dev set image deployment/gpr-backend web="$IMAGE:$tag"
          kubectl -n gpr-dev set image deployment/gpr-worker worker="$IMAGE:$tag"
          kubectl -n gpr-dev rollout status deployment/gpr-backend --timeout=180s
          kubectl -n gpr-dev rollout status deployment/gpr-worker --timeout=180s