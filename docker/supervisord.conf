[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = %(ENV_WEB_AUTOSTART)s
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = %(ENV_WEB_AUTOSTART)s
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue]
command = php artisan queue:work --queue=default,emails --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart = %(ENV_WORKER_AUTOSTART)s
autorestart = true
stopwaitsecs = 30
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command = php artisan schedule:work
autostart = %(ENV_WORKER_AUTOSTART)s
autorestart = true
stopwaitsecs = 10
priority = 40
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
